name: Deploy design preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static export can't include server API routes. Remove them just for
      # this build — source on main is untouched.
      - name: Strip API routes for static build
        run: rm -rf app/api

      - name: Build static site
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: "/scannr"
          NEXT_PUBLIC_STATIC_DEMO: "true"
          # Placeholder Supabase values so createClient() doesn't throw at
          # module load. The static demo never calls Supabase at runtime.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
        run: npm run build

      - name: Prevent Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
